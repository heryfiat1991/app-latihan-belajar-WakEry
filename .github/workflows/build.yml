name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Semak Keluar Kod
      uses: actions/checkout@v4

    - name: Sediakan Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Pasang Library / Dependensi
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyinstaller

    - name: Bina Fail .exe Menggunakan PyInstaller
      run: |
        pyinstaller --noconsole --onefile --add-data "soalan.json;." main.py

    - name: Muat Naik Hasil .exe Sebagai Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Belajar-Windows
        path: dist/main.exe

    - name: Cipta GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/main.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}